[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kaika"
version = "0.1.0"
description = "Turn a piece of music into a video clip: audio-driven fluid simulation, metamorphosed by a video diffusion model, from a single local command."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Florent Lejoly" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "librosa>=0.10",
    "soundfile>=0.12",
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
    "imageio>=2.31",
    "imageio-ffmpeg>=0.4",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
kaika = "kaika.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kaika"]

[tool.hatch.build.targets.wheel.force-include]
"recipes" = "kaika/recipes"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
