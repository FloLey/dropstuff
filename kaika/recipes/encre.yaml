name: encre
seed: 1107

fluid:
  resolution: 256
  render_resolution: 512
  dissipation: 0.95
  lookahead_s: 6.0
  palette: ["#1a1a1a", "#3a3a3a", "#5c5c5c", "#8a8a8a", "#c9c9c9"]
  splats:
    low:  { radius: 0.16, force: 7000, placement: anchored }
    high: { radius: 0.025, force: 2600, placement: scatter, max_per_beat: 7 }
  vorticity: { min: 4, max: 24, driver: rms }

diffusion:
  model: wan-2.2-vace
  backend: local
  strength: 0.45
  control: [depth, flow]
  chunk_s: 5.0
  overlap_frames: 24

post:
  fps: 24
  aspect: square

prompts:
  base: "black ink diffusing in water, sumi-e, monochrome, high contrast"
  intro: "a single drop of ink hitting still water"
  build: "ink tendrils reaching, gathering"
  drop:  "violent bloom of black ink, fractal plumes"
  verse: "slow ink drift, grey washes"
  outro: "ink settling, clearing water"
  default: "ink in water, abstract"
